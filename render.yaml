# Render blueprint for the backend (https://render.com -> New -> Blueprint -> pick this repository).
# Values marked "sync: false" are secrets: Render asks for them when you create the service.
services:
  - type: web
    name: securesphere-api
    runtime: docker
    plan: free              # free instance (sleeps after 15 minutes without visitors)
    region: singapore       # closest Render region to India
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL            # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: JWT_SECRET
        generateValue: true       # Render creates a long random secret
      - key: CORS_ORIGINS         # your Vercel address, e.g. https://securesphere.vercel.app
        sync: false
      - key: FRONTEND_URL         # same address; used in emailed links
        sync: false
      - key: FORWARDED_ALLOW_IPS  # trust Render's proxy so login lockouts see real visitor IPs
        value: "*"
      - key: USE_MOCK_SCANNER
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY    # optional: without it the assistant uses its built-in answers
        sync: false
